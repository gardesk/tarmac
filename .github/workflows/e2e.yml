name: e2e

# The e2e harness boots a macOS VM with tart to drive the real daemon. GitHub-
# hosted macOS runners are themselves VMs and can't nest one, so this runs only
# on a self-hosted runner that has tart + a provisioned `tarmac-e2e` template.
# It is manual — the fast `cargo test` suite in ci.yml is the per-PR gate.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: [self-hosted, macos, tart]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Preflight
        run: |
          for tool in tart jq sshpass; do
            command -v "$tool" >/dev/null || { echo "missing $tool"; exit 1; }
          done
          tart list --format json | jq -e '.[] | select(.Name == "tarmac-e2e")' \
            >/dev/null || { echo "template 'tarmac-e2e' not provisioned"; exit 1; }

      - name: Run e2e suite
        run: make e2e
