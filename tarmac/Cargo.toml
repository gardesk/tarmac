[package]
name = "tarmac"
version = "0.3.4"
edition = "2024"

[dependencies]
# macOS interop
objc2 = { version = "0.6", default-features = false, features = ["exception"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSColorWell",
    "NSControl",
    "NSFont",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSEvent",
    "NSScreen",
    "NSScrollView",
    "NSSplitView",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSTabView",
    "NSTabViewController",
    "NSTableColumn",
    "NSTableView",
    "NSTabViewItem",
    "NSText",
    "NSTextField",
    "NSTextView",
    "NSToolbar",
    "NSToolbarItem",
    "NSViewController",
    "NSWindow",
    "NSWorkspace",
    "NSColor",
    "NSView",
    "NSGraphics",
    "NSGraphicsContext",
    "NSBezierPath",
    "NSPopUpButton",
    "NSSlider",
    "libc",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-application-services = { version = "0.3", default-features = false, features = [
    "AXError",
    "AXUIElement",
    "AXValue",
    "HIServices",
    "libc",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "CFArray",
    "CFCGTypes",
    "CFDictionary",
    "CFMachPort",
    "CFNumber",
    "CFRunLoop",
    "CFString",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "CGDirectDisplay",
    "CGEvent",
    "CGEventTypes",
    "CGWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSDictionary",
    "NSArray",
    "NSData",
    "NSEnumerator",
    "NSIndexSet",
    "NSString",
    "NSNotification",
    "NSProcessInfo",
    "block2",
] }
block2 = "0.6"

# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Lua configuration
mlua = { version = "0.10", features = ["lua54", "vendored"] }

# Serialization (IPC)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Regex for window rule matching
regex = "1"

# Utilities
bitflags = "2"
ctrlc = "3"
dirs = "6"
